<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Prova Parte 2</title>
</head>
<body>
  <form onsubmit="validar(event)">
    <fieldset>
      <legend>Formulario</legend>
      <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome" required>
      </div>
      
      <div>
        <label for="sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" placeholder="Difite seu sobrenome" required>
      </div>

      <div>
        <label for="cpf">CPF:</label>
        <input type="number" id="cpf" placeholder="Digite seu CPF" required>
      </div>

      <div>
        <label for="telefone">Telefone:</label>
        <input type="number" id="telefone" placeholder="Digite seu telefone" required>
      </div>

      <div>
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" placeholder="Digite seu endereço" required>
      </div>

      <div>
        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Digite sua idade" required>
      </div>

      <div>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Digite seu email" required>
      </div>

      <div id="botao">
        <button type="submit">Enviar</button>
      </div>
    </fieldset>
  </form>

  <div>
    <fieldset>
      <legend>Perfil</legend>
      <p id="perfil">Depois de enviado seus dados aparecerão aqui</p>
    </fieldset>
  </div>

  <script src="script.js"/>
</body>
</html>
