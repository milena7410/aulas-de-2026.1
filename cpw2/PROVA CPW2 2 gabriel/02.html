<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <style>
        form {
            margin: 20px auto;
            width: 400px;
            padding: 1em;
            border: 1px solid #ccc;
            border-radius: 1em;
        }

        #res {
            margin: 20px auto;
            width: 400px;
            white-space: pre-line;
        }

        form div+div {
            margin-top: 1em;
        }

        label {
            display: inline-block;
            width: 90px;
            text-align: right;
        }

        input {
            font: 1em sans-serif;
            width: 250px;
            box-sizing: border-box;
            border: 1px solid #999;
            padding: 5px;
        }

        input:focus {
            border-color: #000;
        }

        .button {
            padding-left: 95px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form>
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" value="gabriel">
        </div>

        <div>
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" value="lemos">
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="text" id="email" value="voce@gmail.com">
        </div>

        <div>
            <label for="CPF">CPF:</label>
            <input type="text" id="CPF" maxlength="14" placeholder="000.000.000-00">
        </div>

        <div>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" maxlength="15" placeholder="(67) 99999-9999">
        </div>

        <div>
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" value="Aquidauana">
        </div>

        <div>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" value="21">
        </div>

        <div class="button">
            <button type="button" onclick="enviar()">Enviar</button>
        </div>
    </form>

    <p id="res"></p>

    <script>

        function formatarCPF(cpf) {
            cpf = cpf.replace(/\D/g, "");

            return cpf.replace(
                /(\d{3})(\d{3})(\d{3})(\d{2})/,
                "$1.$2.$3-$4"
            );
        }

        function formatarTelefone(telefone) {
            telefone = telefone.replace(/\D/g, "");

            return telefone.replace(
                /(\d{2})(\d{5})(\d{4})/,
                "($1) $2-$3"
            );
        }

        function validarEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
        }

        // Formatação automática CPF
        document.getElementById("CPF").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "")

            if (valor.length > 11) {
                valor = valor.slice(0, 11)
            }

            valor = valor.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            valor = valor.replace(
                /(\d{3})(\d)/,
                "$1.$2"
            );

            valor = valor.replace(
                /(\d{3})(\d{1,2})$/,
                "$1-$2"
            );

            this.value = valor;
        });

        // Formatação automática Telefone
        document.getElementById("telefone").addEventListener("input", function () {

            let valor = this.value.replace(/\D/g, "")

            if (valor.length > 11) {
                valor = valor.slice(0, 11);
            }

            valor = valor.replace(
                /^(\d{2})(\d)/g,
                "($1) $2"
            );

            valor = valor.replace(
                /(\d{5})(\d)/,
                "$1-$2"
            );

            this.value = valor;
        });

        function enviar() {

            let nome = document.getElementById("nome").value.trim()
            let sobrenome = document.getElementById("sobrenome").value.trim()
            let email = document.getElementById("email").value.trim()
            let cpf = document.getElementById("CPF").value
            let telefone = document.getElementById("telefone").value
            let endereco = document.getElementById("endereco").value.trim()
            let idade = document.getElementById("idade").value

            const cpfLimpo = cpf.replace(/\D/g, "")
            const telefoneLimpo = telefone.replace(/\D/g, "")

            if (nome === "") {
                alert("Informe o nome.")
                return
            }

            if (sobrenome === "") {
                alert("Informe o sobrenome.")
                return;
            }

            if (!validarEmail(email)) {
                alert("Email inválido.")
                return;
            }

            if (cpfLimpo.length !== 11) {
                alert("CPF deve conter 11 números.")
                return;
            }

            if (telefoneLimpo.length !== 11) {
                alert("Telefone deve conter 11 números.")
                return;
            }

            const nomeFormatado = nome.replace(
                /(^\w{1})|(\s+\w{1})/g,
                letra => letra.toUpperCase()
            );

            const sobrenomeFormatado = sobrenome.replace(
                /(^\w{1})|(\s+\w{1})/g,
                letra => letra.toUpperCase()
            );

            const cpfFormatado = formatarCPF(cpfLimpo);
            const telefoneFormatado = formatarTelefone(telefoneLimpo);

            document.getElementById("res").innerText =
`Seu nome: ${nomeFormatado} ${sobrenomeFormatado}
Seu email: ${email}
Seu CPF: ${cpfFormatado}
Seu telefone: ${telefoneFormatado}
Seu endereço: ${endereco}
Sua idade: ${idade}`
        }

    </script>

</body>

</html>
