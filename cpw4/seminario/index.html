<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Factory Method</title>

</head>
<body>

  <h1>Exemplo de Factory Method</h1>

  <p>Escolha um tipo de produto para armazenar:</p>

  <button onclick="armazenarProduto('alimento')">Alimento</button>
  <button onclick="armazenarProduto('roupa')">Roupa</button>

  <div id="resultado"></div>

  <script src="script.js"></script>
</body>
</html>
